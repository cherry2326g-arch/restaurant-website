<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Maison Belle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<header>
  <nav class="nav">
    <h1>Maison Belle</h1>
    <div>
      <a href="#">Home</a>
      <a href="#menu">Menu</a>
      <a href="#booking">Book</a>
    </div>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <div class="overlay">
    <h2>Luxury Dining Experience</h2>
    <p>Where taste meets elegance</p>
    <a href="#booking" class="btn">Reserve Table</a>
  </div>
</section>

<!-- MENU -->
<section id="menu" class="menu">
  <h2>Our Signature Dishes</h2>
  <div class="menu-grid">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092">
      <h3>Italian Pizza</h3>
      <p>$15</p>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1555949258-eb67b1ef0ceb">
      <h3>Creamy Pasta</h3>
      <p>$18</p>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd">
      <h3>Classic Burger</h3>
      <p>$12</p>
    </div>

  </div>
</section>

<!-- BOOKING -->
<section id="booking" class="booking">
  <div class="booking-box">
    <h2>Book a Table</h2>
    <input type="text" placeholder="Your Name">
    <input type="date">
    <button>Reserve Now</button>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <p>© 2026 Maison Belle | Designed with ❤️</p>
</footer>

</body>
</html>
